<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img">
<title>YoussefOS — Mission Control Dashboard</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#0f1118"/><stop offset="1" stop-color="#161927"/>
  </linearGradient>
  <linearGradient id="nameGrad" x1="0" x2="1">
    <stop stop-color="#7dcfff"/><stop offset=".6" stop-color="#bb9af7"/><stop offset="1" stop-color="#f7768e"/>
  </linearGradient>
  <linearGradient id="scanGrad" x1="0" x2="1">
    <stop stop-color="#7dcfff" stop-opacity="0"/><stop offset=".5" stop-color="#7dcfff" stop-opacity=".06"/><stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="lineGrad" x1="0" x2="1">
    <stop stop-color="#7dcfff" stop-opacity="0"/><stop offset=".3" stop-color="#7dcfff" stop-opacity=".4"/><stop offset=".7" stop-color="#bb9af7" stop-opacity=".4"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#c0caf5" stroke-opacity=".02"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softGlow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    text{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,monospace}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>

<!-- Background -->
<rect width="1200" height="400" rx="20" fill="url(#bg)"/>
<rect width="1200" height="400" rx="20" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="398" rx="19" fill="none" stroke="#292e42" stroke-opacity=".4"/>

<!-- Corner brackets (tech/HUD feel) -->
<path d="M12 25 L12 12 L25 12" fill="none" stroke="#7dcfff" stroke-width="1.5" opacity=".2"/>
<path d="M1175 12 L1188 12 L1188 25" fill="none" stroke="#7dcfff" stroke-width="1.5" opacity=".2"/>
<path d="M12 375 L12 388 L25 388" fill="none" stroke="#bb9af7" stroke-width="1.5" opacity=".2"/>
<path d="M1175 388 L1188 388 L1188 375" fill="none" stroke="#bb9af7" stroke-width="1.5" opacity=".2"/>

<!-- Chrome bar -->
<circle cx="32" cy="28" r="4.5" fill="#565f89" opacity=".5"/>
<circle cx="48" cy="28" r="4.5" fill="#565f89" opacity=".35"/>
<circle cx="64" cy="28" r="4.5" fill="#565f89" opacity=".25"/>
<text x="84" y="33" font-size="12" fill="#565f89" letter-spacing="1.5">YOUSSEF_OS</text>
<text x="195" y="33" font-size="10" fill="#292e42">v2.0</text>
<text x="1168" y="33" text-anchor="end" font-size="10" fill="#565f89" letter-spacing="2">MISSION CONTROL</text>

<!-- Separator -->
<line x1="24" y1="48" x2="1176" y2="48" stroke="#292e42" stroke-opacity=".35"/>

<!-- Animated scan line -->
<rect y="48" width="180" height="340" fill="url(#scanGrad)" rx="4">
  <animate attributeName="x" from="-200" to="1400" dur="8s" repeatCount="indefinite"/>
</rect>

<!-- ══════════ LEFT SECTION ══════════ -->

<!-- Big name with gradient -->
<text x="55" y="130" font-size="60" font-weight="bold" fill="url(#nameGrad)" filter="url(#softGlow)" letter-spacing="3">YOUSSEF</text>

<!-- Subtitles -->
<text x="58" y="160" font-size="16" fill="#a9b1d6" letter-spacing=".5">Backend Engineer &amp; Problem Solver</text>
<text x="58" y="184" font-size="13" fill="#565f89">Computer Engineering Student</text>

<!-- Decorative accent line -->
<rect x="58" y="198" width="260" height="1.5" rx="1" fill="url(#lineGrad)"/>

<!-- Tagline command style -->
<text x="58" y="228" font-size="13">
  <tspan fill="#9ece6a">$</tspan><tspan fill="#565f89"> build </tspan><tspan fill="#7dcfff">→</tspan><tspan fill="#565f89"> understand </tspan><tspan fill="#7dcfff">→</tspan><tspan fill="#565f89"> improve</tspan>
</text>

<!-- Currently Learning badge -->
<text x="58" y="270" font-size="10" fill="#565f89" letter-spacing="2">CURRENT FOCUS</text>
<rect x="58" y="280" width="210" height="30" rx="6" fill="#1a1b2e" fill-opacity=".8" stroke="#292e42" stroke-opacity=".5"/>
<text x="68" y="300" font-size="12" fill="#e0af68">Machine Learning &amp; AI</text>
<circle cx="255" cy="295" r="3" fill="#e0af68" opacity=".5">
  <animate attributeName="opacity" values=".3;.8;.3" dur="2.5s" repeatCount="indefinite"/>
</circle>

<!-- Motto -->
<text x="58" y="348" font-size="11" fill="#565f89" font-style="italic">"Making the world a better place through code"</text>

<!-- ══════════ RIGHT SECTION ══════════ -->

<!-- Status Panel -->
<rect x="660" y="62" width="500" height="130" rx="12" fill="#1a1b2e" fill-opacity=".6" stroke="#292e42" stroke-opacity=".5"/>
<text x="682" y="86" font-size="10" fill="#565f89" letter-spacing="2">SYSTEM STATUS</text>
<line x1="682" y1="94" x2="1138" y2="94" stroke="#292e42" stroke-opacity=".3"/>

<!-- Status: Online -->
<circle cx="695" cy="116" r="4" fill="#9ece6a" filter="url(#softGlow)">
  <animate attributeName="opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite"/>
</circle>
<text x="710" y="120" font-size="12" fill="#9ece6a" font-weight="bold">ONLINE</text>

<!-- Role -->
<text x="810" y="120" font-size="11" fill="#565f89">ROLE</text>
<text x="860" y="120" font-size="11" fill="#a9b1d6">Backend Developer</text>

<!-- Location -->
<text x="695" y="148" font-size="11" fill="#565f89">LOCATION</text>
<text x="780" y="148" font-size="11" fill="#a9b1d6">Cairo, Egypt</text>

<!-- Focus -->
<text x="695" y="176" font-size="11" fill="#565f89">FOCUS</text>
<text x="750" y="176" font-size="11" fill="#bb9af7">ML &amp; Problem Solving</text>

<!-- Uptime indicator -->
<text x="960" y="148" font-size="11" fill="#565f89">UPTIME</text>
<text x="1020" y="148" font-size="11" fill="#7dcfff">∞</text>

<!-- Skill Metrics Panel -->
<rect x="660" y="208" width="500" height="155" rx="12" fill="#1a1b2e" fill-opacity=".6" stroke="#292e42" stroke-opacity=".5"/>
<text x="682" y="232" font-size="10" fill="#565f89" letter-spacing="2">SKILL METRICS</text>
<line x1="682" y1="240" x2="1138" y2="240" stroke="#292e42" stroke-opacity=".3"/>

<!-- C++ bar -->
<text x="695" y="268" font-size="12" fill="#a9b1d6">C++</text>
<rect x="775" y="256" width="320" height="16" rx="4" fill="#1e2030"/>
<rect x="775" y="256" width="0" height="16" rx="4" fill="#9ece6a" opacity=".75">
  <animate attributeName="width" values="0;0;288;288;0" keyTimes="0;.08;.2;.85;1" dur="10s" repeatCount="indefinite"/>
</rect>
<text x="1108" y="268" font-size="10" fill="#565f89">90%</text>

<!-- Python bar -->
<text x="695" y="297" font-size="12" fill="#a9b1d6">Python</text>
<rect x="775" y="285" width="320" height="16" rx="4" fill="#1e2030"/>
<rect x="775" y="285" width="0" height="16" rx="4" fill="#7dcfff" opacity=".75">
  <animate attributeName="width" values="0;0;208;208;0" keyTimes="0;.12;.24;.85;1" dur="10s" repeatCount="indefinite"/>
</rect>
<text x="1108" y="297" font-size="10" fill="#565f89">65%</text>

<!-- SQL bar -->
<text x="695" y="326" font-size="12" fill="#a9b1d6">SQL</text>
<rect x="775" y="314" width="320" height="16" rx="4" fill="#1e2030"/>
<rect x="775" y="314" width="0" height="16" rx="4" fill="#bb9af7" opacity=".75">
  <animate attributeName="width" values="0;0;160;160;0" keyTimes="0;.16;.28;.85;1" dur="10s" repeatCount="indefinite"/>
</rect>
<text x="1108" y="326" font-size="10" fill="#565f89">50%</text>

<!-- Flask bar -->
<text x="695" y="355" font-size="12" fill="#a9b1d6">Flask</text>
<rect x="775" y="343" width="320" height="16" rx="4" fill="#1e2030"/>
<rect x="775" y="343" width="0" height="16" rx="4" fill="#e0af68" opacity=".75">
  <animate attributeName="width" values="0;0;176;176;0" keyTimes="0;.20;.32;.85;1" dur="10s" repeatCount="indefinite"/>
</rect>
<text x="1108" y="355" font-size="10" fill="#565f89">55%</text>

<!-- ══════════ BOTTOM BAR ══════════ -->
<line x1="24" y1="375" x2="1176" y2="375" stroke="#292e42" stroke-opacity=".25"/>
<text x="55" y="392" font-size="11" fill="#565f89">youssef@cairo</text>
<text x="155" y="392" font-size="11" fill="#7dcfff">·</text>
<text x="170" y="392" font-size="11" fill="#565f89">build → understand → improve</text>

<!-- Decorative dots on bottom right -->
<circle cx="1100" cy="390" r="2" fill="#9ece6a" opacity=".3"/>
<circle cx="1115" cy="390" r="2" fill="#7dcfff" opacity=".3"/>
<circle cx="1130" cy="390" r="2" fill="#bb9af7" opacity=".3"/>
<circle cx="1145" cy="390" r="2" fill="#e0af68" opacity=".3"/>
<circle cx="1160" cy="390" r="2" fill="#f7768e" opacity=".3"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img">
<title>Youssef's Terminal — Interactive Introduction</title>
<defs>
  <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#1a1b26"/><stop offset="1" stop-color="#16161e"/>
  </linearGradient>
  <pattern id="tgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#a9b1d6" stroke-opacity=".015"/>
  </pattern>
  <filter id="tglow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

  <!-- Clip paths — typing animation (dur=40s) -->
  <!-- Block 1: whoami -->
  <clipPath id="c1"><rect x="28" y="66" width="0" height="24"><animate attributeName="width" values="0;0;480;480;0" keyTimes="0;.04;.08;.95;1" dur="40s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="o1"><rect x="28" y="94" width="0" height="24"><animate attributeName="width" values="0;0;380;380;0" keyTimes="0;.10;.14;.95;1" dur="40s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="o2"><rect x="28" y="122" width="0" height="24"><animate attributeName="width" values="0;0;900;900;0" keyTimes="0;.15;.22;.95;1" dur="40s" repeatCount="indefinite"/></rect></clipPath>

  <!-- Block 2: cat stack.conf -->
  <clipPath id="c2"><rect x="28" y="164" width="0" height="24"><animate attributeName="width" values="0;0;600;600;0" keyTimes="0;.25;.30;.95;1" dur="40s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="o3"><rect x="28" y="192" width="0" height="24"><animate attributeName="width" values="0;0;700;700;0" keyTimes="0;.32;.37;.95;1" dur="40s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="o4"><rect x="28" y="220" width="0" height="24"><animate attributeName="width" values="0;0;750;750;0" keyTimes="0;.38;.43;.95;1" dur="40s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="o5"><rect x="28" y="248" width="0" height="24"><animate attributeName="width" values="0;0;700;700;0" keyTimes="0;.44;.49;.95;1" dur="40s" repeatCount="indefinite"/></rect></clipPath>

  <!-- Block 3: cat mission.log -->
  <clipPath id="c3"><rect x="28" y="290" width="0" height="24"><animate attributeName="width" values="0;0;650;650;0" keyTimes="0;.53;.58;.95;1" dur="40s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="o6"><rect x="28" y="318" width="0" height="24"><animate attributeName="width" values="0;0;700;700;0" keyTimes="0;.60;.65;.95;1" dur="40s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="o7"><rect x="28" y="346" width="0" height="24"><animate attributeName="width" values="0;0;720;720;0" keyTimes="0;.66;.71;.95;1" dur="40s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="o8"><rect x="28" y="374" width="0" height="24"><animate attributeName="width" values="0;0;680;680;0" keyTimes="0;.72;.77;.95;1" dur="40s" repeatCount="indefinite"/></rect></clipPath>

  <!-- Block 4: echo $MOTTO -->
  <clipPath id="c4"><rect x="28" y="416" width="0" height="24"><animate attributeName="width" values="0;0;560;560;0" keyTimes="0;.80;.84;.95;1" dur="40s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="o9"><rect x="28" y="444" width="0" height="24"><animate attributeName="width" values="0;0;950;950;0" keyTimes="0;.86;.92;.95;1" dur="40s" repeatCount="indefinite"/></rect></clipPath>

  <style>
    text{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,monospace}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>

<!-- Terminal background -->
<rect width="1200" height="530" rx="16" fill="url(#tbg)"/>
<rect width="1200" height="530" rx="16" fill="url(#tgrid)"/>
<rect x="1" y="1" width="1198" height="528" rx="15" fill="none" stroke="#292e42" stroke-opacity=".5"/>

<!-- Chrome bar -->
<rect width="1200" height="48" rx="16" fill="#13141f"/>
<rect x="0" y="16" width="1200" height="32" fill="#13141f"/>
<line x1="0" y1="48" x2="1200" y2="48" stroke="#292e42" stroke-opacity=".4"/>
<circle cx="26" cy="24" r="6.5" fill="#f7768e" opacity=".85"/>
<circle cx="48" cy="24" r="6.5" fill="#e0af68" opacity=".85"/>
<circle cx="70" cy="24" r="6.5" fill="#9ece6a" opacity=".85"/>
<text x="600" y="29" text-anchor="middle" font-size="12" fill="#565f89" letter-spacing="1">youssef@cairo — bash</text>

<!-- CRT scan line -->
<rect x="8" y="48" width="1184" height="1.5" fill="#c0caf5" opacity=".025" rx="1">
  <animate attributeName="y" values="48;520;48" dur="7s" repeatCount="indefinite"/>
</rect>

<!-- ═══════ Block 1: whoami ═══════ -->
<g clip-path="url(#c1)">
  <text x="32" y="82" font-size="14"><tspan fill="#9ece6a">youssef@cairo</tspan><tspan fill="#565f89">:</tspan><tspan fill="#7dcfff">~</tspan><tspan fill="#565f89">$ </tspan><tspan fill="#c0caf5">whoami</tspan></text>
</g>
<g clip-path="url(#o1)">
  <text x="52" y="110" font-size="14"><tspan fill="#7dcfff">→ </tspan><tspan fill="#a9b1d6" font-weight="bold">Youssef Sayed</tspan></text>
</g>
<g clip-path="url(#o2)">
  <text x="52" y="138" font-size="14"><tspan fill="#7dcfff">→ </tspan><tspan fill="#a9b1d6">Computer Engineering Student </tspan><tspan fill="#565f89">│</tspan><tspan fill="#a9b1d6"> Backend Developer</tspan></text>
</g>

<!-- ═══════ Block 2: cat stack.conf ═══════ -->
<g clip-path="url(#c2)">
  <text x="32" y="180" font-size="14"><tspan fill="#9ece6a">youssef@cairo</tspan><tspan fill="#565f89">:</tspan><tspan fill="#7dcfff">~</tspan><tspan fill="#565f89">$ </tspan><tspan fill="#c0caf5">cat stack.conf</tspan></text>
</g>
<g clip-path="url(#o3)">
  <text x="52" y="208" font-size="14"><tspan fill="#bb9af7">languages   </tspan><tspan fill="#a9b1d6">C++ </tspan><tspan fill="#565f89">· </tspan><tspan fill="#a9b1d6">Python </tspan><tspan fill="#565f89">· </tspan><tspan fill="#a9b1d6">SQL</tspan></text>
</g>
<g clip-path="url(#o4)">
  <text x="52" y="236" font-size="14"><tspan fill="#bb9af7">backend     </tspan><tspan fill="#a9b1d6">Flask </tspan><tspan fill="#565f89">· </tspan><tspan fill="#a9b1d6">REST APIs </tspan><tspan fill="#565f89">· </tspan><tspan fill="#a9b1d6">Git</tspan></text>
</g>
<g clip-path="url(#o5)">
  <text x="52" y="264" font-size="14"><tspan fill="#bb9af7">core        </tspan><tspan fill="#a9b1d6">DSA </tspan><tspan fill="#565f89">· </tspan><tspan fill="#a9b1d6">Algorithms </tspan><tspan fill="#565f89">· </tspan><tspan fill="#a9b1d6">OOP</tspan></text>
</g>

<!-- ═══════ Block 3: cat mission.log ═══════ -->
<g clip-path="url(#c3)">
  <text x="32" y="306" font-size="14"><tspan fill="#9ece6a">youssef@cairo</tspan><tspan fill="#565f89">:</tspan><tspan fill="#7dcfff">~</tspan><tspan fill="#565f89">$ </tspan><tspan fill="#c0caf5">cat mission.log</tspan></text>
</g>
<g clip-path="url(#o6)">
  <text x="52" y="334" font-size="14"><tspan fill="#7dcfff">→ </tspan><tspan fill="#a9b1d6">Building robust backend systems</tspan></text>
</g>
<g clip-path="url(#o7)">
  <text x="52" y="362" font-size="14"><tspan fill="#7dcfff">→ </tspan><tspan fill="#a9b1d6">Exploring Machine Learning &amp; AI</tspan></text>
</g>
<g clip-path="url(#o8)">
  <text x="52" y="390" font-size="14"><tspan fill="#7dcfff">→ </tspan><tspan fill="#a9b1d6">Solving problems on Codeforces</tspan></text>
</g>

<!-- ═══════ Block 4: echo $MOTTO ═══════ -->
<g clip-path="url(#c4)">
  <text x="32" y="432" font-size="14"><tspan fill="#9ece6a">youssef@cairo</tspan><tspan fill="#565f89">:</tspan><tspan fill="#7dcfff">~</tspan><tspan fill="#565f89">$ </tspan><tspan fill="#c0caf5">echo</tspan><tspan fill="#bb9af7"> $MOTTO</tspan></text>
</g>
<g clip-path="url(#o9)">
  <text x="52" y="460" font-size="14"><tspan fill="#7dcfff">→ </tspan><tspan fill="#e0af68">"Making the world a better place through code"</tspan></text>
</g>

<!-- ═══════ Final prompt with blinking cursor ═══════ -->
<g opacity="0">
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.92;.93;.95;1" dur="40s" repeatCount="indefinite"/>
  <text x="32" y="498" font-size="14"><tspan fill="#9ece6a">youssef@cairo</tspan><tspan fill="#565f89">:</tspan><tspan fill="#7dcfff">~</tspan><tspan fill="#565f89">$ </tspan></text>
  <rect x="178" y="484" width="9" height="16" rx="1" fill="#c0caf5" filter="url(#tglow)">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
  </rect>
</g>

</svg>
